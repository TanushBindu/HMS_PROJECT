<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #f3f4f6;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #2563eb, #1e40af);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 25px;
            box-shadow: 3px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3 class="text-xl font-bold px-5 mb-4">Dashboard</h3>
    <a href="/patients">Patients</a>
    <a href="/doctors">Doctors</a>
    <a href="/appointments">Appointments</a>
    <a href="/staff">Staff</a>
    <a href="/invoice">Invoice</a>
    <a href="/logout" class="absolute bottom-5 left-5 font-semibold">Logout</a>
</div>

<!-- Main Content -->
<div class="ml-[260px] p-10">
    <h2 class="text-3xl font-bold text-gray-800">Hospital Management</h2>
    <p class="text-gray-500 mb-6">Overview of hospital statistics</p>

    <!-- Stats Cards -->
    <div class="grid md:grid-cols-3 gap-6">
        <div class="bg-white rounded-2xl shadow-md p-6 hover:shadow-lg transition">
            <h4 class="text-blue-600 font-semibold mb-2">Total Appointments</h4>
            <p class="text-3xl font-bold" th:text="${totalAppointments}">0</p>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 hover:shadow-lg transition">
            <h4 class="text-green-600 font-semibold mb-2">Total Doctors</h4>
            <p class="text-3xl font-bold" th:text="${totalDoctors}">0</p>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 hover:shadow-lg transition">
            <h4 class="text-purple-600 font-semibold mb-2">Today's Appointments</h4>
            <p class="text-3xl font-bold" th:text="${todayAppointments}">0</p>
        </div>
    </div>

    <!-- Available Doctors -->
    <div class="bg-white rounded-2xl shadow-md p-8 mt-10">
        <h4 class="text-blue-600 font-semibold mb-6 text-xl flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 14l9-5-9-5-9 5 9 5zm0 0v7m0-7l-9-5m9 5l9 5"/>
            </svg>
            Available Doctors
        </h4>

        <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" th:if="${availableDoctors != null}">
            <div th:each="doctor : ${availableDoctors}"
                 class="flex items-center bg-blue-50 rounded-xl p-4 shadow-sm hover:shadow-md transition-transform transform hover:-translate-y-1">
                <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
                     alt="Doctor Avatar" class="w-14 h-14 rounded-full border-2 border-blue-400 mr-4">
                <div>
                    <h5 class="text-lg font-semibold text-gray-800" th:text="${doctor.name}">Dr. John Doe</h5>
                    <p class="text-sm text-gray-500" th:text="${doctor.specialization}">Cardiology</p>
                    <span class="inline-block mt-2 text-xs font-semibold px-3 py-1 bg-green-100 text-green-600 rounded-full">
                        Available Today
                    </span>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(availableDoctors)}" class="text-gray-500 text-center py-10">
            No doctors available today.
        </div>
    </div>
</div>

</body>
</html>
