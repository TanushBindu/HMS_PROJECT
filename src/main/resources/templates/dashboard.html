<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hospital Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f8f9fa; margin:0; padding:0; }
        .sidebar { width:250px; height:100vh; background:#0d6efd; color:white; position:fixed; top:0; left:0; padding-top:20px; }
        .sidebar h3 { margin-left:20px; font-weight:bold; }
        .sidebar .nav-link { color:white; padding:12px 20px; display:block; font-weight:500; }
        .sidebar .nav-link:hover { background:#084298; border-radius:6px; }
        .sidebar .logout { position:absolute; bottom:20px; left:20px; color:white; font-weight:bold; text-decoration:none; }
        .sidebar .logout:hover { text-decoration:underline; }
        .content { margin-left:250px; padding:30px; }
        .cards { display:flex; gap:20px; margin-top:20px; flex-wrap:wrap; }
        .card { flex:1; min-width:250px; background:white; padding:20px; border-radius:10px; box-shadow:0px 3px 10px rgba(0,0,0,0.1); }
        .card h4 { margin:0 0 10px 0; color:#0d6efd; }
        .card p, .card ul { font-size:16px; font-weight:bold; margin:0; }
        .card ul { padding-left:20px; list-style:disc; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Dashboard</h3>
    <a href="/patients" class="nav-link">Patients</a>
    <a href="/doctors" class="nav-link">Doctors</a>
    <a href="/appointments" class="nav-link">Appointments</a>
    <a href="/staff" class="nav-link">Staff</a>
    <a href="/invoice" class="nav-link">Invoice</a>
    <a href="/logout" class="logout">Logout</a>
</div>

<div class="content">
    <h2>Hospital Management</h2>
    <p class="text-muted mt-2">Overview of hospital statistics</p>

    <div class="cards">
        <div class="card">
            <h4>Total Appointments</h4>
            <p th:text="${totalAppointments}">0</p>
        </div>

        <div class="card">
            <h4>Available Doctors</h4>
            <ul>
                <li th:each="doctor : ${availableDoctors}" th:text="${doctor.name}">Doctor Name</li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
