<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Invoices</h2>

    <form class="mb-3" method="get" th:action="@{/invoices}">
        <div class="input-group">
            <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by patient or doctor"/>
            <button class="btn btn-primary">Search</button>
        </div>
    </form>

    <div class="mb-3">
        <a th:href="@{/invoices/add}" class="btn btn-success">Add Invoice</a>
    </div>

    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Treatment</th>
            <th>Amount</th>
            <th>Paid</th>
            <th>Payment Mode</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inv : ${invoices}">
            <td th:text="${inv.id}">1</td>
            <td th:text="${inv.patient != null ? inv.patient.name : 'N/A'}">Patient Name</td>
            <td th:text="${inv.doctor != null ? inv.doctor.name : 'N/A'}">Doctor Name</td>
            <td th:text="${inv.treatment}">Treatment</td>
            <td th:text="${inv.amount}">Amount</td>
            <td th:text="${inv.paymentMode}">Payment Mode</td>
            <td th:text="${inv.paid ? 'Yes' : 'No'}">Paid</td>
            <td>
                <a th:href="@{/invoices/pdf/{id}(id=${inv.id})}"
                   class="btn btn-sm btn-outline-primary">Download PDF</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
