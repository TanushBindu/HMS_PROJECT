<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Appointments</h2>

    <!-- Stats -->
    <div class="row mb-3">
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5>Total Appointments</h5>
                    <p th:text="${totalAppointments}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5>Today's Appointments</h5>
                    <p th:text="${todaysAppointments}">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Search -->
    <form th:action="@{/appointments}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" class="form-control" name="search" placeholder="Search by Patient or Doctor" th:value="${search}">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
    </form>

    <!-- Add Appointment Button -->
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addAppointmentModal">Add Appointment</button>

    <!-- Appointment Table -->
    <div class="card shadow-sm">
        <div class="card-header">Appointments</div>
        <div class="card-body table-responsive">
            <table class="table table-hover table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Specialization</th>
                    <th>Date & Time</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td th:text="${a.id}"></td>
                    <td th:text="${a.patient != null ? a.patient.name : 'N/A'}"></td>
                    <td th:text="${a.doctor != null ? a.doctor.name : 'N/A'}"></td>
                    <td th:text="${a.doctor != null ? a.doctor.specialization : 'N/A'}"></td>
                    <td th:text="${a.appointmentDate != null ? #temporals.format(a.appointmentDate, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
                    <td th:text="${a.reason}"></td>
                    <td th:text="${a.status}"></td>
                    <td>
                        <a th:href="@{/appointments/edit/{id}(id=${a.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/appointments/delete/{id}(id=${a.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this appointment?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Appointment Modal -->
<div class="modal fade" id="addAppointmentModal" tabindex="-1" aria-labelledby="addAppointmentLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form th:action="@{/appointments/add}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addAppointmentLabel">Add Appointment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="patientId" class="form-label">Patient ID</label>
                    <input type="number" class="form-control" name="patientId" required>
                </div>
                <div class="mb-3">
                    <label for="doctorId" class="form-label">Doctor ID</label>
                    <input type="number" class="form-control" name="doctorId" required>
                </div>
                <div class="mb-3">
                    <label for="reason" class="form-label">Reason</label>
                    <input type="text" class="form-control" name="reason" required>
                </div>
                <div class="mb-3">
                    <label for="dateTime" class="form-label">Appointment Date & Time</label>
                    <input type="datetime-local" class="form-control" name="dateTime" required>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" name="status" required>
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="UPCOMING">Upcoming</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Add Appointment</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
