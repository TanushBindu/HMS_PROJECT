<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div th:replace="dashboard :: sidebar"></div> <!-- Reuse sidebar -->

<div id="content" class="container-fluid">
    <h2 class="mb-4">Appointments</h2>

    <!-- Quick Stats -->
    <div class="row mb-4" th:if="${role == 'ADMIN' or role == 'DOCTOR'}">
        <div class="col-md-3">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Today's Appointments</h5>
                    <p class="card-text" th:text="${todayAppointments}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">Upcoming Appointments</h5>
                    <p class="card-text" th:text="${upcomingAppointments}">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Appointments Table -->
    <!-- Table with filters -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
            <span>Appointments</span>
            <div>
                <select id="statusFilter" class="form-select form-select-sm d-inline-block" style="width:150px;">
                    <option value="">All Status</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
                <a th:href="@{/appointments/add}" class="btn btn-sm btn-primary ms-2" th:if="${role == 'ADMIN' or role == 'DOCTOR'}">
                    <i class="bi bi-plus-circle"></i> Add Appointment
                </a>
            </div>
        </div>
        <div class="card-body table-responsive">
            <table id="appointmentsTable" class="table table-hover table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Date & Time</th>
                    <th>Status</th>
                    <th th:if="${role != 'PATIENT'}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appointment : ${appointments}" th:classappend="${appointment.status.toLowerCase()}">
                    <td th:text="${appointment.id}">1</td>
                    <td th:text="${appointment.patientName}">John Doe</td>
                    <td th:text="${appointment.doctorName}">Dr. Smith</td>
                    <td th:text="${appointment.dateTime}">2025-09-22 10:00 AM</td>
                    <td>
                        <span th:text="${appointment.status}" th:classappend="
                            ${appointment.status == 'Scheduled'} ? 'badge bg-warning' :
                            ${appointment.status == 'Completed'} ? 'badge bg-success' :
                            ${appointment.status == 'Cancelled'} ? 'badge bg-danger' : 'badge bg-secondary'"></span>
                    </td>
                    <td th:if="${role != 'PATIENT'}">
                        <a th:href="@{/appointments/edit/{id}(id=${appointment.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/appointments/delete/{id}(id=${appointment.id})}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Filter appointments by status
        const statusFilter = document.getElementById('statusFilter');
        const appointmentsTable = document.getElementById('appointmentsTable').getElementsByTagName('tbody')[0];
        statusFilter.addEventListener('change', function() {
            const selectedStatus = statusFilter.value.toLowerCase();
            Array.from(appointmentsTable.rows).forEach(row => {
                const statusCell = row.cells[4].textContent.toLowerCase();
                row.style.display = (selectedStatus === '' || statusCell === selectedStatus) ? '' : 'none';
            });
        });
    </script>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
