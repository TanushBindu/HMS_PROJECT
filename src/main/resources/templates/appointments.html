<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Appointments</h2>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Appointment</button>
    </div>

    <!-- Counts -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-center p-3">
                <h6>Total Appointments</h6>
                <p class="fs-4 fw-bold" th:text="${totalCount}">0</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center p-3">
                <h6>Today's Appointments</h6>
                <p class="fs-4 fw-bold" th:text="${todayCount}">0</p>
            </div>
        </div>
        <div class="col-md-6">
            <canvas id="appointmentsChart"></canvas>
        </div>
    </div>

    <!-- Appointment Cards -->
    <div class="row">
        <div class="col-md-4 mb-3" th:each="a : ${appointments}">
            <div class="card">
                <div class="card-body">
                    <p><strong>Patient:</strong> <span th:text="${a.patientName}"></span></p>
                    <p><strong>Doctor:</strong> <span th:text="${a.doctorName}"></span></p>
                    <p><strong>Date:</strong> <span th:text="${#temporals.format(a.appointmentDate, 'yyyy-MM-dd HH:mm')}"></span></p>
                    <p><strong>Reason:</strong> <span th:text="${a.reason}"></span></p>
                    <p><strong>Status:</strong> <span th:text="${a.status}"></span></p>

                    <button class="btn btn-sm btn-secondary" th:attr="data-id=${a.id}" onclick="openEditModal(this)">Edit</button>
                    <a th:href="@{'/appointments/delete/' + ${a.id}}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete?')">Delete</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="appointmentForm" th:action="@{/appointments/save}" method="post" th:object="${appointment}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{id}" id="modalId"/>
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Appointment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Patient</label>
                        <select th:field="*{patient.id}" id="modalPatient" class="form-control">
                            <option th:each="p: ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Doctor</label>
                        <select th:field="*{doctor.id}" id="modalDoctor" class="form-control">
                            <option th:each="d: ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Date & Time</label>
                        <input type="datetime-local" th:field="*{appointmentDate}" id="modalDate" class="form-control"/>
                    </div>
                    <div class="mb-3">
                        <label>Reason</label>
                        <select th:field="*{reason}" id="modalReason" class="form-control">
                            <option value="Consultation">Consultation</option>
                            <option value="Follow-up">Follow-up</option>
                            <option value="Emergency">Emergency</option>
                            <option value="Checkup">Checkup</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Status</label>
                        <select th:field="*{status}" id="modalStatus" class="form-control">
                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                            <option value="Rescheduled">Rescheduled</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success" id="modalSaveBtn">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modalEl = document.getElementById('appointmentModal');
    const modal = new bootstrap.Modal(modalEl);
    const form = document.getElementById('appointmentForm');
    const modalTitle = document.getElementById('modalTitle');

    function openAddModal() {
        modalTitle.textContent = 'Add Appointment';
        form.action = '/appointments/save';
        form.reset();
        document.getElementById('modalId').value = '';
        modal.show();
    }

    function openEditModal(btn) {
        const id = btn.getAttribute('data-id');
        if (!id) return;

        fetch(`/appointments/${id}`)
            .then(res => {
                if (!res.ok) throw new Error('Appointment not found');
                return res.json();
            })
            .then(appt => {
                modalTitle.textContent = 'Edit Appointment';
                form.action = '/appointments/update';

                document.getElementById('modalId').value = appt.id;
                document.getElementById('modalPatient').value = appt.patient.id;
                document.getElementById('modalDoctor').value = appt.doctor.id;
                document.getElementById('modalDate').value = appt.appointmentDate.substring(0,16);
                document.getElementById('modalReason').value = appt.reason;
                document.getElementById('modalStatus').value = appt.status;

                modal.show();
            })
            .catch(err => {
                console.error('Error opening edit modal:', err);
                alert('Unable to load appointment data.');
            });
    }

    // --- Chart ---
    const ctx = document.getElementById('appointmentsChart').getContext('2d');
    const weeklyData = /*[[${weeklyCounts}]]*/ [0,0,0,0,0,0,0]; // fallback
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
            datasets: [{
                label: 'Appointments',
                data: weeklyData,
                backgroundColor: 'rgba(54,162,235,0.7)'
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } }
        }
    });
</script>
</body>
</html>
