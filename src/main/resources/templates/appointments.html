<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 bg-dark text-white vh-100 p-3">
            <h4>Hospital</h4>
            <ul class="nav flex-column mt-4">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link text-white">Dashboard</a></li>
                <li class="nav-item"><a href="/appointments" class="nav-link active">Appointments</a></li>
                <li class="nav-item"><a href="/patients" class="nav-link text-white">Patients</a></li>
                <li class="nav-item"><a href="/doctors" class="nav-link text-white">Doctors</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <!-- Header Row -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card p-3 text-center shadow-sm">
                        <h6>Total Appointments</h6>
                        <p class="fs-4 fw-bold" th:text="${appointments.size()}">0</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 text-center shadow-sm">
                        <h6>Today's Appointments</h6>
                        <p class="fs-4 fw-bold" th:text="${todayCount}">0</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <canvas id="appointmentsChart"></canvas>
                </div>
            </div>

            <!-- Add Button -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Appointments</h3>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">+ Add Appointment</button>
            </div>

            <!-- Table -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-striped align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Reason</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${appointments}">
                            <td th:text="${a.id}"></td>
                            <td th:text="${a.patient.name}"></td>
                            <td th:text="${a.doctor.name}"></td>
                            <td th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy HH:mm')}"></td>
                            <td th:text="${a.status}"></td>
                            <td th:text="${a.reason}"></td>
                            <td>
                                <button class="btn btn-sm btn-primary"
                                        th:attr="data-id=${a.id}"
                                        onclick="openEditModal(this)">Edit</button>
                                <a th:href="@{'/appointments/delete/' + ${a.id}}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Delete this appointment?')">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Add Appointment Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/appointments/save}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Add Appointment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Patient</label>
                    <select class="form-select" name="patient.id" required>
                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>

                    <label class="form-label mt-2">Doctor</label>
                    <select class="form-select" name="doctor.id" required>
                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                    </select>

                    <label class="form-label mt-2">Date</label>
                    <input type="datetime-local" class="form-control" name="appointmentDate" required>

                    <label class="form-label mt-2">Reason</label>
                    <input type="text" class="form-control" name="reason" required>

                    <label class="form-label mt-2">Status</label>
                    <select class="form-select" name="status">
                        <option value="Scheduled">Scheduled</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Appointment Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/appointments/update}" method="post">
                <input type="hidden" id="editId" name="id"/>
                <div class="modal-header">
                    <h5 class="modal-title">Edit Appointment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Reason</label>
                    <input type="text" class="form-control" id="editReason" name="reason" required>
                    <label class="form-label mt-2">Status</label>
                    <select class="form-select" id="editStatus" name="status">
                        <option value="Scheduled">Scheduled</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openEditModal(btn) {
        const id = btn.getAttribute("data-id");
        fetch(`/appointments/${id}`)
            .then(res => res.json())
            .then(appt => {
                document.getElementById("editId").value = appt.id;
                document.getElementById("editReason").value = appt.reason;
                document.getElementById("editStatus").value = appt.status;
                new bootstrap.Modal(document.getElementById("editModal")).show();
            });
    }

    new Chart(document.getElementById('appointmentsChart'), {
        type: 'bar',
        data: {
            labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
            datasets: [{
                label: 'Appointments',
                data: [3,5,2,6,4,7,2],
                backgroundColor: 'rgba(54,162,235,0.7)'
            }]
        }
    });
</script>
</body>
</html>
