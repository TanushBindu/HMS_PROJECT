<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f9fc; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #0d6efd; min-height: 100vh; color: #fff; padding: 20px 15px; }
        .sidebar h4 { margin-bottom: 20px; font-weight: bold; }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .sidebar a:hover, .sidebar a.active { background-color: #084298; }
        .main-content { padding: 30px; }
        .card-appt { display: flex; align-items: center; background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .appt-info { flex-grow: 1; }
        .appt-name { font-size: 18px; font-weight: bold; margin: 0; }
        .appt-meta { color: #6c757d; font-size: 14px; }
        .btn-delete { background-color: #dc3545; color: #fff; }
        .btn-add { background-color: #0d6efd; color: #fff; font-weight: bold; }
        .summary-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .summary-card { background: #fff; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); flex: 1; }
        .summary-card h5 { margin: 0; font-size: 14px; color: #6c757d; }
        .summary-card h2 { margin: 0; font-size: 28px; font-weight: bold; }
    </style>
</head>
<body>
<div class="row g-0">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
        <h4>Appointments</h4>
        <a th:href="@{/appointments}" class="active">All Appointments</a>
        <a th:href="@{/appointments/today}">Today’s Appointments</a>
    </div>

    <!-- Main content -->
    <div class="col-md-10 main-content">
        <!-- Top bar -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Appointments</h2>
            <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addApptModal">+ Add Appointment</button>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card">
                <h5>Total Appointments</h5>
                <h2 th:text="${totalAppointments}">0</h2>
            </div>
            <div class="summary-card">
                <h5>Today’s Appointments</h5>
                <h2 th:text="${todaysAppointments}">0</h2>
            </div>
        </div>

        <!-- Appointment Cards -->
        <div th:each="a : ${appointments}" class="card-appt">
            <div class="appt-info">
                <p class="appt-name" th:text="${a.patient.name} + ' with ' + ${a.doctor.name}"></p>
                <p class="appt-meta">
                    <span th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy HH:mm')}"></span>
                    • <span th:text="${a.reason}"></span>
                </p>
            </div>
            <div>
                <button type="button" class="btn btn-sm btn-warning"
                        th:onclick="'openEditAppt(' + ${a.id} + ')'">Edit</button>
                <a th:href="@{'/appointments/delete/' + ${a.id}}" class="btn btn-sm btn-delete"
                   onclick="return confirm('Are you sure you want to delete this appointment?')">Delete</a>
            </div>
        </div>
    </div>
</div>

<!-- Add Appointment Modal -->
<div class="modal fade" id="addApptModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/appointments/save}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Add Appointment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label>Patient</label>
                        <select name="patient.id" class="form-control" required>
                            <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3"><label>Doctor</label>
                        <select name="doctor.id" class="form-control" required>
                            <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3"><label>Date & Time</label>
                        <input type="datetime-local" name="appointmentDate" class="form-control" required>
                    </div>
                    <div class="mb-3"><label>Reason</label>
                        <input type="text" name="reason" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Appointment Modal -->
<div class="modal fade" id="editApptModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/appointments/update}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Appointment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="edit-id">

                    <div class="mb-3">
                        <label>Patient</label>
                        <select name="patient.id" id="edit-patient" class="form-control" required>
                            <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Doctor</label>
                        <select name="doctor.id" id="edit-doctor" class="form-control" required>
                            <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Date & Time</label>
                        <input type="datetime-local" name="appointmentDate" id="edit-dateTime" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Status</label>
                        <div class="mb-3">
                            <label>Status</label>
                            <select name="status" id="edit-status" class="form-control">
                                <option value="Scheduled">Scheduled</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Reason</label>
                        <input type="text" name="reason" id="edit-reason" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Update Appointment</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function document.getElementById('edit-status').value = appt.status ? appt.status : 'Scheduled'; {
        fetch('/appointments/get/' + id)
            .then(res => res.json())
            .then(appt => {
                document.getElementById('edit-id').value = appt.id;
                document.getElementById('edit-patient').value = appt.patient.id;
                document.getElementById('edit-doctor').value = appt.doctor.id;
                document.getElementById('edit-dateTime').value = appt.appointmentDate.substring(0,16);
                document.getElementById('edit-status').value = appt.status || 'Scheduled';
                document.getElementById('edit-reason').value = appt.reason || '';
                new bootstrap.Modal(document.getElementById('editApptModal')).show();
            })
            .catch(err => console.error("Error fetching appointment:", err));
    }
</script>
</body>
</html>
