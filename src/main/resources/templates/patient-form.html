<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="dashboard :: sidebar"></div>

<div id="content" class="container mt-4">
    <h2 th:text="${patient.id != null} ? 'Edit Patient' : 'Add Patient'"></h2>
    <form th:action="@{${patient.id != null} ? '/patients/update/' + ${patient.id} : '/patients/save'}"
          th:object="${patient}" method="post" class="mt-3">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Type</label>
            <select th:field="*{type}" class="form-select" required>
                <option value="OPD">OPD</option>
                <option value="INPATIENT">In-Patient</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Contact</label>
            <input type="text" th:field="*{contact}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/patients}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
