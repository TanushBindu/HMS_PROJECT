<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f4f7fa} .login-card{max-width:420px;margin:80px auto;padding:30px;border-radius:8px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,0.08)}</style>
</head>
<body>
<div class="login-card">
    <h4 class="text-center mb-4">Hospital Management System</h4>
    <form th:action="@{/login}" method="post">
        <div class="mb-3"><input name="username" class="form-control" placeholder="Username" required></div>
        <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
        <div class="d-grid"><button class="btn btn-primary">Login</button></div>
        <div th:if="${param.error}" class="text-danger mt-2">Invalid username or password</div>
        <div th:if="${param.logout}" class="text-success mt-2">Logged out successfully.</div>
    </form>
</div>
</body></html>
