<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div id="content" class="container-fluid">
    <h2 class="mb-4">Staff</h2>

    <!-- Staff Table -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
            <span>All Staff</span>
            <div>
                <input type="text" id="searchStaff" class="form-control form-control-sm d-inline-block"
                       placeholder="Search by name..." style="width:200px;">
                <a th:href="@{/staff/add}" class="btn btn-sm btn-primary ms-2">
                    <i class="bi bi-plus-circle"></i> Add Staff
                </a>
            </div>
        </div>
        <div class="card-body table-responsive">
            <table id="staffTable" class="table table-hover table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${staffList}">
                    <td th:text="${s.id}">1</td>
                    <td th:text="${s.name}">John Smith</td>
                    <td th:text="${s.role}">Nurse</td>
                    <td th:text="${s.email}">john@hms.com</td>
                    <td>
                        <a th:href="@{/staff/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/staff/delete/{id}(id=${s.id})}"
                           onclick="return confirm('Delete staff?');"
                           class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchStaff');
        const staffTable = document.getElementById('staffTable').getElementsByTagName('tbody')[0];
        searchInput.addEventListener('keyup', function () {
            const filter = searchInput.value.toLowerCase();
            Array.from(staffTable.rows).forEach(row => {
                const nameCell = row.cells[1].textContent.toLowerCase();
                row.style.display = nameCell.includes(filter) ? '' : 'none';
            });
        });
    </script>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
