<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f9fc; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #0d6efd; min-height: 100vh; color: #fff; padding: 20px 15px; }
        .sidebar h4 { margin-bottom: 20px; font-weight: bold; }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .sidebar a:hover, .sidebar a.active { background-color: #084298; }
        .main-content { padding: 30px; }
        .card-staff { display: flex; flex-direction: column; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); height: 100%; }
        .staff-info p { margin: 2px 0; }
        .btn-edit { background-color: #6c757d; color: #fff; }
        .btn-delete { background-color: #dc3545; color: #fff; }
        .btn-add { background-color: #0d6efd; color: #fff; font-weight: bold; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    </style>
</head>
<body>
<div class="row g-0">
    <div class="col-md-2 sidebar">
        <h4>Staff</h4>
        <a th:href="@{/staff}" class="active">All Staff</a>
    </div>

    <div class="col-md-10 main-content">
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search staff...">
        </div>
        <div class="top-bar">
            <h2>Staff Management</h2>
            <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addModal">+ Add Staff</button>
        </div>

        <div class="row g-3">
            <div th:each="s : ${staffList}" class="col-12 col-md-6 col-lg-4">
                <div class="card-staff">
                    <div class="staff-info">
                        <p><strong>Name:</strong> <span th:text="${s.name}"></span></p>
                        <p><strong>Role:</strong> <span th:text="${s.role}"></span></p>
                        <p><strong>Contact:</strong> <span th:text="${s.contact}"></span></p>
                        <p><strong>Email:</strong> <span th:text="${s.email}"></span></p>
                        <p><strong>Username:</strong> <span th:text="${s.username}"></span></p>
                        <p><strong>Status:</strong> <span th:text="${s.active ? 'Active' : 'Inactive'}"></span></p>
                    </div>
                    <div class="mt-2">
                        <button class="btn btn-sm btn-edit me-2" th:attr="data-id=${s.id}" onclick="openEditModal(this)">Edit</button>
                        <a th:href="@{'/staff/delete/' + ${s.id}}" class="btn btn-sm btn-delete" onclick="return confirm('Delete this staff?')">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Staff Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5>Add Staff</h5>
            <form th:action="@{/staff/save}" th:object="${newStaff}" method="post">
                <input type="text" th:field="*{name}" class="form-control mb-2" placeholder="Name" required/>
                <input type="text" th:field="*{username}" class="form-control mb-2" placeholder="Username" required/>
                <input type="email" th:field="*{email}" class="form-control mb-2" placeholder="Email" required/>
                <input type="text" th:field="*{contact}" class="form-control mb-2" placeholder="Contact"/>
                <input type="password" th:field="*{password}" class="form-control mb-2" placeholder="Password" required/>
                <select th:field="*{role}" class="form-control mb-2" required>
                    <option value="">-- Select Role --</option>
                    <option value="Doctor">Doctor</option>
                    <option value="Receptionist">Receptionist</option>
                    <option value="Accountant">Accountant</option>
                    <option value="Nurse">Nurse</option>
                </select>
                <select th:field="*{gender}" class="form-control mb-2">
                    <option value="">-- Gender --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </form>
        </div>
    </div>
</div>

<!-- Edit Staff Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5>Edit Staff</h5>
            <form th:action="@{/staff/update}" th:object="${editStaff}" method="post">
                <input type="hidden" th:field="*{id}" id="editId"/>
                <input type="text" th:field="*{name}" id="editName" class="form-control mb-2" required/>
                <input type="text" th:field="*{username}" id="editUsername" class="form-control mb-2" required/>
                <input type="email" th:field="*{email}" id="editEmail" class="form-control mb-2" required/>
                <input type="text" th:field="*{contact}" id="editContact" class="form-control mb-2"/>
                <input type="password" th:field="*{password}" id="editPassword" class="form-control mb-2"/>
                <select th:field="*{role}" id="editRole" class="form-control mb-2" required>
                    <option value="Doctor">Doctor</option>
                    <option value="Receptionist">Receptionist</option>
                    <option value="Accountant">Accountant</option>
                    <option value="Nurse">Nurse</option>
                </select>
                <select th:field="*{gender}" id="editGender" class="form-control mb-2">
                    <option value="">-- Gender --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <select th:field="*{active}" id="editStatus" class="form-control mb-2">
                    <option th:value="true">Active</option>
                    <option th:value="false">Inactive</option>
                </select>
                <button type="submit" class="btn btn-primary w-100">Update</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('keyup', function() {
        const filter = searchInput.value.toLowerCase();
        const cards = document.querySelectorAll('.card-staff');
        cards.forEach(card => {
            const text = card.innerText.toLowerCase();
            card.style.display = text.includes(filter) ? '' : 'none';
        });
    });

    function openEditModal(btn) {
        const id = btn.getAttribute("data-id");
        fetch(`/staff/${id}`)
            .then(res => res.json())
            .then(staff => {
                document.getElementById("editId").value = staff.id;
                document.getElementById("editName").value = staff.name;
                document.getElementById("editRole").value = staff.role;
                document.getElementById("editContact").value = staff.contact;
                document.getElementById("editGender").value = staff.gender;
                document.getElementById("editUsername").value = staff.username;
                document.getElementById("editEmail").value = staff.email;
                document.getElementById("editStatus").value = staff.active;
                new bootstrap.Modal(document.getElementById("editModal")).show();
            });
    }
</script>
</body>
</html>
