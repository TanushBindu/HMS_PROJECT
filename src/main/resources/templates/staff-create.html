<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Staff Access Control</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/custom.css"/>
</head>
<body>
<!-- Sidebar -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Main Content -->
<div class="main-content p-4">
    <div class="card">
        <div class="card-header">
            <h3>Create Staff Access Control</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/staff/create}" th:object="${ac}" method="post">
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <input type="text" th:field="*{role}" class="form-control" placeholder="Enter Role" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Module Name</label>
                    <input type="text" th:field="*{moduleName}" class="form-control" placeholder="Enter Module Name" required/>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/staff/list}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
