<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Edit Appointment</h2>

    <form th:action="@{/appointments/edit/{id}(id=${appointment.id})}" method="post">
        <div class="mb-3">
            <label>Patient</label>
            <select name="patientId" class="form-select" required>
                <option th:each="p : ${patients}" th:value="${p.id}"
                        th:text="${p.name}"
                        th:selected="${appointment.patient != null and appointment.patient.id == p.id}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Doctor</label>
            <select name="doctorId" class="form-select" required>
                <option th:each="d : ${doctors}" th:value="${d.id}"
                        th:text="${d.name + ' (' + d.specialization + ')'}"
                        th:selected="${appointment.doctor != null and appointment.doctor.id == d.id}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Reason</label>
            <input type="text" name="reason" class="form-control" th:value="${appointment.reason}" required>
        </div>

        <div class="mb-3">
            <label>Date & Time</label>
            <input type="datetime-local" name="dateTime" class="form-control"
                   th:value="${appointment.appointmentDate != null ? appointment.appointmentDate.toString().substring(0,16) : ''}" required>
        </div>

        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-select" required>
                <option value="SCHEDULED" th:selected="${appointment.status=='SCHEDULED'}">Scheduled</option>
                <option value="UPCOMING" th:selected="${appointment.status=='UPCOMING'}">Upcoming</option>
                <option value="COMPLETED" th:selected="${appointment.status=='COMPLETED'}">Completed</option>
                <option value="CANCELLED" th:selected="${appointment.status=='CANCELLED'}">Cancelled</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>
</body>
</html>
