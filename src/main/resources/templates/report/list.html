<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lab Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f9fc; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #0d6efd; min-height: 100vh; color: #fff; padding: 20px 15px; }
        .sidebar h4 { margin-bottom: 20px; font-weight: bold; }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .sidebar a:hover, .sidebar a.active { background-color: #084298; }
        .main-content { padding: 30px; }
        .card-report { display: flex; flex-direction: column; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); height: 100%; }
        .report-info p { margin: 2px 0; }
        .btn-edit { background-color: #6c757d; color: #fff; }
        .btn-delete { background-color: #dc3545; color: #fff; }
        .btn-add { background-color: #0d6efd; color: #fff; font-weight: bold; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    </style>
</head>
<body>
<div class="row g-0">
    <div class="col-md-2 sidebar">
        <h4>Reports</h4>
        <a th:href="@{/report}" class="active">All Reports</a>
    </div>

    <div class="col-md-10 main-content">
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search reports...">
        </div>
        <div class="top-bar">
            <h2>Patient Lab Reports</h2>
            <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addModal">+ Add Report</button>
        </div>

        <div class="row g-3">
            <div th:each="r : ${reports}" class="col-12 col-md-6 col-lg-4">
                <div class="card-report">
                    <div class="report-info">
                        <p><strong>Patient:</strong> <span th:text="${r.patient.name}">Patient Name</span></p>
                        <p><strong>Doctor:</strong> <span th:text="${r.doctor.name}">Doctor Name</span></p>
                        <p><strong>Appointment:</strong> <span th:text="${r.appointment != null ? r.appointment.id : 'N/A'}">Appointment</span></p>
                        <p><strong>Report Name:</strong> <span th:text="${r.reportName}">Report Name</span></p>
                        <p><strong>Report Date:</strong> <span th:text="${r.reportDate}">2025-09-28</span></p>
                    </div>
                    <div class="mt-2">
                        <button class="btn btn-sm btn-edit me-2" th:attr="data-id=${r.id}" onclick="openEditModal(this)">Edit</button>
                        <a th:href="@{'/report/delete/' + ${r.id}}" class="btn btn-sm btn-delete" onclick="return confirm('Delete this report?')">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Report Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5>Add Lab Report</h5>
            <form th:action="@{/report/save}" th:object="${newReport}" method="post">
                <select th:field="*{patient}" class="form-control mb-2" required>
                    <option value="">-- Select Patient --</option>
                    <option th:each="p : ${patients}" th:value="${p}" th:text="${p.name}">Patient</option>
                </select>
                <select th:field="*{doctor}" class="form-control mb-2" required>
                    <option value="">-- Select Doctor --</option>
                    <option th:each="d : ${doctors}" th:value="${d}" th:text="${d.name}">Doctor</option>
                </select>
                <select th:field="*{appointment}" class="form-control mb-2">
                    <option value="">-- Select Appointment (Optional) --</option>
                    <option th:each="a : ${appointments}" th:value="${a}" th:text="${a.id}">Appointment</option>
                </select>
                <input type="text" th:field="*{reportName}" class="form-control mb-2" placeholder="Report Name" required/>
                <input type="date" th:field="*{reportDate}" class="form-control mb-2" required/>
                <textarea th:field="*{reportDetails}" class="form-control mb-2" placeholder="Report Details"></textarea>
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </form>
        </div>
    </div>
</div>

<!-- Edit Report Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5>Edit Lab Report</h5>
            <form th:action="@{/report/update}" th:object="${editReport}" method="post">
                <input type="hidden" th:field="*{id}" id="editId"/>
                <select th:field="*{patient}" id="editPatient" class="form-control mb-2" required>
                    <option th:each="p : ${patients}" th:value="${p}" th:text="${p.name}">Patient</option>
                </select>
                <select th:field="*{doctor}" id="editDoctor" class="form-control mb-2" required>
                    <option th:each="d : ${doctors}" th:value="${d}" th:text="${d.name}">Doctor</option>
                </select>
                <select th:field="*{appointment}" id="editAppointment" class="form-control mb-2">
                    <option value="">-- Select Appointment (Optional) --</option>
                    <option th:each="a : ${appointments}" th:value="${a}" th:text="${a.id}">Appointment</option>
                </select>
                <input type="text" th:field="*{reportName}" id="editReportName" class="form-control mb-2" required/>
                <input type="date" th:field="*{reportDate}" id="editReportDate" class="form-control mb-2" required/>
                <textarea th:field="*{reportDetails}" id="editReportDetails" class="form-control mb-2"></textarea>
                <button type="submit" class="btn btn-primary w-100">Update</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('keyup', function() {
        const filter = searchInput.value.toLowerCase();
        const cards = document.querySelectorAll('.card-report');
        cards.forEach(card => {
            const text = card.innerText.toLowerCase();
            card.style.display = text.includes(filter) ? '' : 'none';
        });
    });

    function openEditModal(btn) {
        const id = btn.getAttribute("data-id");
        fetch(`/report/${id}`)
            .then(res => res.json())
            .then(report => {
                document.getElementById("editId").value = report.id;
                document.getElementById("editReportName").value = report.reportName;
                document.getElementById("editReportDate").value = report.reportDate;
                document.getElementById("editReportDetails").value = report.reportDetails;
                document.getElementById("editPatient").value = report.patient.id;
                document.getElementById("editDoctor").value = report.doctor.id;
                document.getElementById("editAppointment").value = report.appointment ? report.appointment.id : '';
                new bootstrap.Modal(document.getElementById("editModal")).show();
            });
    }
</script>
</body>
</html>
