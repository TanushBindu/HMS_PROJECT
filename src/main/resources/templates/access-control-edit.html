<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Access Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Edit Access Control</h2>

    <div class="card shadow-sm">
        <div class="card-header">Access Control Details</div>
        <div class="card-body">
            <form th:action="@{/access-control/{id}(id=${ac.id})}" th:object="${ac}" method="post">
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <input type="text" th:field="*{role}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Module Name</label>
                    <input type="text" th:field="*{moduleName}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Access Control</button>
                <a th:href="@{/access-control/list}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
