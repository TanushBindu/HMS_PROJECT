<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="dashboard :: sidebar"></div>

<div id="content" class="container mt-4">
    <h2>Patient Details</h2>
    <ul class="list-group">
        <li class="list-group-item"><b>ID:</b> <span th:text="${patient.id}"></span></li>
        <li class="list-group-item"><b>Name:</b> <span th:text="${patient.name}"></span></li>
        <li class="list-group-item"><b>Type:</b> <span th:text="${patient.type}"></span></li>
        <li class="list-group-item"><b>Contact:</b> <span th:text="${patient.contact}"></span></li>
        <li class="list-group-item"><b>Username:</b> <span th:text="${patient.username}"></span></li>
    </ul>
    <a th:href="@{/patients}" class="btn btn-secondary mt-3">Back</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
