<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div th:replace="dashboard :: sidebar"></div>

<div id="content" class="container-fluid">
    <h2 class="mb-4">Doctors</h2>

    <!-- Doctors Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white d-flex justify-content-between">
            <span>All Doctors</span>
            <a th:href="@{/doctors/add}" class="btn btn-sm btn-primary" th:if="${role == 'ADMIN'}">
                <i class="bi bi-plus-circle"></i> Add Doctor
            </a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-hover table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Specialization</th>
                    <th>Contact</th>
                    <th th:if="${role == 'ADMIN'}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doctor : ${doctors}">
                    <td th:text="${doctor.id}">1</td>
                    <td th:text="${doctor.name}">Dr. Smith</td>
                    <td th:text="${doctor.specialization}">Cardiology</td>
                    <td th:text="${doctor.contact}">9876543210</td>
                    <td th:if="${role == 'ADMIN'}">
                        <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/doctors/view/{id}(id=${doctor.id})}" class="btn btn-sm btn-info">View</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
