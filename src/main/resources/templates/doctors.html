<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Doctors</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2 class="mb-4">Doctor Management</h2>

<!-- Add Doctor Button -->
<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#doctorModal"
        onclick="openAddDoctor()">Add Doctor</button>

<!-- Doctor List -->
<table class="table table-bordered">
    <thead>
    <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Available Today</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="doc : ${doctors}">
        <td th:text="${doc.name}"></td>
        <td th:text="${doc.department}"></td>
        <td>
            <span th:text="${doc.availableToday} ? 'Yes' : 'No'"></span>
        </td>
        <td>
            <!-- Edit -->
            <button class="btn btn-sm btn-warning"
                    data-bs-toggle="modal" data-bs-target="#doctorModal"
                    th:attr="data-id=${doc.id},data-name=${doc.name},data-department=${doc.department},data-available=${doc.availableToday}"
                    onclick="openEditDoctor(this)">
                Edit
            </button>
            <!-- Delete -->
            <form th:action="@{'/doctors/delete/' + ${doc.id}}" method="post" style="display:inline;"
                  onsubmit="return confirm('Are you sure you want to delete this doctor?');">
                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- Add/Edit Modal -->
<div class="modal fade" id="doctorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/doctors/add}" method="post" id="doctorForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="doctorModalLabel">Add Doctor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="doctorId">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" id="doctorName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="department" id="doctorDept" required>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="availableToday" id="doctorAvail">
                        <label class="form-check-label">Available Today</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openAddDoctor() {
        document.getElementById("doctorModalLabel").innerText = "Add Doctor";
        document.getElementById("doctorForm").action = "/doctors/add";
        document.getElementById("doctorId").value = "";
        document.getElementById("doctorName").value = "";
        document.getElementById("doctorDept").value = "";
        document.getElementById("doctorAvail").checked = false;
    }

    function openEditDoctor(btn) {
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');
        const department = btn.getAttribute('data-department');
        const available = btn.getAttribute('data-available') === 'true';
        // Set modal fields accordingly
        document.getElementById('doctorModalLabel').innerText = "Edit Doctor";
        document.getElementById("doctorForm").action = "/doctors/edit";
        document.getElementById('doctorId').value = id;
        document.getElementById('doctorName').value = name;
        document.getElementById('doctorDept').value = department;
        document.getElementById('doctorAvail').checked = available;
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
