<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .doctor-card {
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            background: #fff;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
        }
        .doctor-card:hover { transform: scale(1.05); }
        .doctor-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        .modal-content {
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Doctors</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDoctorModal">+ Add Doctor</button>
    </div>

    <!-- Search bar -->
    <form th:action="@{/doctors/search}" method="get" class="row mb-4 g-2">
        <div class="col-md-4">
            <input type="text" name="name" placeholder="Search by name" class="form-control">
        </div>
        <div class="col-md-4">
            <input type="text" name="specialization" placeholder="Search by specialization" class="form-control">
        </div>
        <div class="col-md-4">
            <select name="available" class="form-select">
                <option value="">All</option>
                <option value="true">Available Today</option>
                <option value="false">Not Available</option>
            </select>
        </div>
        <div class="col-md-12 text-end">
            <button type="submit" class="btn btn-outline-primary">Search</button>
        </div>
    </form>

    <!-- Doctors Grid -->
    <div class="row g-4">
        <div class="col-md-3" th:each="doctor : ${doctors}">
            <div class="doctor-card">
                <img th:src="@{/images/doctor.png}" alt="Doctor" class="doctor-avatar mb-2">
                <h5 th:text="${doctor.name}">Doctor Name</h5>
                <p th:text="${doctor.specialization}">Specialization</p>
                <p>
                    <span th:text="${doctor.availableToday} ? 'Available' : 'Not Available'"></span>
                </p>
                <button class="btn btn-sm btn-outline-primary"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#doctorModal-' + ${doctor.id}">
                    View
                </button>
            </div>
        </div>
    </div>

    <!-- Doctor Detail Modal -->
    <div th:each="doctor : ${doctors}"
         th:id="'doctorModal-' + ${doctor.id}"
         class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="${doctor.name}">Doctor Name</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p><b>Specialization:</b> <span th:text="${doctor.specialization}"></span></p>
                    <p><b>Phone:</b> <span th:text="${doctor.phone}"></span></p>
                    <p><b>Email:</b> <span th:text="${doctor.email}"></span></p>
                    <p><b>Address:</b> <span th:text="${doctor.address}"></span></p>
                    <p><b>Available Today:</b>
                        <span th:text="${doctor.availableToday} ? 'Yes' : 'No'"></span>
                    </p>

                    <h6 class="mt-3 mb-2">Appointments:</h6>
                    <table class="table table-bordered table-sm">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Patient Name</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="appointment : ${doctor.appointments}">
                            <td th:text="${appointment.id}"></td>
                            <td th:text="${appointment.patient.name}"></td>
                            <td th:text="${appointment.reason}"></td>
                            <td th:text="${appointment.status}"></td>
                            <td th:text="${#temporals.format(appointment.appointmentDate, 'dd-MM-yyyy HH:mm')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-warning" data-bs-toggle="modal"
                            th:data-bs-target="'#editDoctorModal-' + ${doctor.id}">
                        Edit
                    </button>
                    <a th:href="@{'/doctors/delete/' + ${doctor.id}}"
                       class="btn btn-danger"
                       onclick="return confirm('Are you sure you want to delete this doctor?');">Delete</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Doctor Modal -->
    <div th:each="doctor : ${doctors}"
         th:id="'editDoctorModal-' + ${doctor.id}"
         class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <form th:action="@{'/doctors/update/' + ${doctor.id}}" method="post">
                <div class="modal-header">
                        <h5 class="modal-title">Edit Doctor</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <input type="text" name="name" class="form-control" th:value="${doctor.name}" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" name="specialization" class="form-control" th:value="${doctor.specialization}" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" name="phone" class="form-control" th:value="${doctor.phone}" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" th:value="${doctor.email}">
                        </div>
                        <div class="mb-3">
                            <input type="text" name="address" class="form-control" th:value="${doctor.address}">
                        </div>
                        <div class="mb-3">
                            <select name="availableToday" class="form-select">
                                <option th:value="true" th:selected="${doctor.availableToday}">Available Today</option>
                                <option th:value="false" th:selected="${!doctor.availableToday}">Not Available</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Save Changes</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Doctor Modal -->
    <div class="modal fade" id="addDoctorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <form th:action="@{/doctors/add}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Doctor</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <input type="text" name="name" class="form-control" placeholder="Name" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" name="specialization" class="form-control" placeholder="Specialization" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" name="phone" class="form-control" placeholder="Phone" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" placeholder="Email">
                        </div>
                        <div class="mb-3">
                            <input type="text" name="address" class="form-control" placeholder="Address">
                        </div>
                        <div class="mb-3">
                            <select name="availableToday" class="form-select">
                                <option value="true">Available Today</option>
                                <option value="false">Not Available</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Save</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
