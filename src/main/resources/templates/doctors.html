<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="content" class="container-fluid">
    <h2 class="mb-4">Doctors</h2>

    <!-- Stats -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5>Total Doctors</h5>
                    <p th:text="${totalDoctors}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5>Available Today</h5>
                    <p th:text="${availableToday}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-dark">
                <div class="card-body">
                    <h5>On Leave</h5>
                    <p th:text="${onLeave}">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Doctors Table -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white d-flex justify-content-between">
            <span>All Doctors</span>
            <div>
                <input type="text" id="searchDoctors" class="form-control form-control-sm d-inline-block"
                       placeholder="Search by name..." style="width:200px;">
                <a th:href="@{/doctors/add}" class="btn btn-sm btn-primary ms-2">
                    <i class="bi bi-plus-circle"></i> Add Doctor
                </a>
            </div>
        </div>
        <div class="card-body table-responsive">
            <table id="doctorsTable" class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Specialization</th>
                    <th>Contact</th>
                    <th>Available Today</th>
                    <th>On Leave</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doctor : ${doctors}">
                    <td th:text="${doctor.id}">1</td>
                    <td th:text="${doctor.name}">Dr. A</td>
                    <td th:text="${doctor.specialization}">Cardiology</td>
                    <td th:text="${doctor.contact}">1234567890</td>
                    <td th:text="${doctor.availableToday}">true</td>
                    <td th:text="${doctor.onLeave}">false</td>
                    <td>
                        <a th:href="@{/doctors/view/{id}(id=${doctor.id})}" class="btn btn-sm btn-info">View</a>
                        <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/doctors/delete/{id}(id=${doctor.id})}" onclick="return confirm('Delete doctor?');"
                           class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Simple search filter
    const searchInput = document.getElementById('searchDoctors');
    const doctorsTable = document.getElementById('doctorsTable').getElementsByTagName('tbody')[0];
    searchInput.addEventListener('keyup', function () {
        const filter = searchInput.value.toLowerCase();
        Array.from(doctorsTable.rows).forEach(row => {
            const nameCell = row.cells[1].textContent.toLowerCase();
            row.style.display = nameCell.includes(filter) ? '' : 'none';
        });
    });
</script>
</body>
</html>
