<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f3f4f6;
            font-family: "Inter", sans-serif;
        }
        .doctor-card {
            border-radius: 16px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.3s ease;
        }
        .doctor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-blue-700">Doctors</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDoctorModal">+ Add Doctor</button>
    </div>

    <!-- Search Bar -->
    <form th:action="@{/doctors/search}" method="get" class="row mb-4 g-2">
        <div class="col-md-4">
            <input type="text" name="name" placeholder="Search by name" class="form-control">
        </div>
        <div class="col-md-4">
            <input type="text" name="specialization" placeholder="Search by specialization" class="form-control">
        </div>
        <div class="col-md-4">
            <select name="available" class="form-select">
                <option value="">All</option>
                <option value="true">Available Today</option>
                <option value="false">Not Available</option>
            </select>
        </div>
        <div class="col-md-12 text-end">
            <button type="submit" class="btn btn-outline-primary">Search</button>
        </div>
    </form>

    <!-- Doctors Grid -->
    <div class="grid md:grid-cols-4 sm:grid-cols-2 gap-6">
        <div th:each="doctor : ${doctors}" class="doctor-card text-center p-4">
            <img th:src="@{/images/doctor.png}" alt="Doctor" class="mx-auto mb-3 rounded-full w-20 h-20 object-cover shadow-sm">
            <h5 th:text="${doctor.name}" class="text-lg font-semibold text-gray-800">Doctor Name</h5>
            <p th:text="${doctor.specialization}" class="text-gray-500">Specialization</p>
            <p class="mt-2">
                <span th:text="${doctor.availableToday} ? 'Available' : 'Not Available'"
                      class="badge"
                      th:classappend="${doctor.availableToday} ? 'bg-success' : 'bg-secondary'"></span>
            </p>

            <div class="mt-3 flex justify-center gap-2">
                <button class="btn btn-sm btn-outline-primary"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#viewDoctor-' + ${doctor.id}">View</button>
                <a th:href="@{'/doctors/delete/' + ${doctor.id}}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this doctor?')">Delete</a>
            </div>
        </div>
    </div>

    <!-- View Doctor Modal -->
    <div th:each="doctor : ${doctors}" th:id="'viewDoctor-' + ${doctor.id}" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-2xl p-3">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="${doctor.name}">Doctor Name</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><b>Specialization:</b> <span th:text="${doctor.specialization}"></span></p>
                    <p><b>Phone:</b> <span th:text="${doctor.phone}"></span></p>
                    <p><b>Email:</b> <span th:text="${doctor.email}"></span></p>
                    <p><b>Address:</b> <span th:text="${doctor.address}"></span></p>
                    <p><b>Available:</b> <span th:text="${doctor.availableToday} ? 'Yes' : 'No'"></span></p>

                    <h6 class="mt-4 mb-2">Appointments</h6>
                    <table class="table table-striped table-sm">
                        <thead>
                        <tr><th>ID</th><th>Patient</th><th>Reason</th><th>Status</th><th>Date</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${doctor.appointments}">
                            <td th:text="${a.id}"></td>
                            <td th:text="${a.patient.name}"></td>
                            <td th:text="${a.reason}"></td>
                            <td th:text="${a.status}"></td>
                            <td th:text="${#temporals.format(a.appointmentDate, 'dd-MM-yyyy HH:mm')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Doctor Modal -->
    <div class="modal fade" id="addDoctorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-2xl p-3">
                <form th:action="@{/doctors/add}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Doctor</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input name="name" class="form-control mb-3" placeholder="Name" required>
                        <input name="specialization" class="form-control mb-3" placeholder="Specialization" required>
                        <input name="phone" class="form-control mb-3" placeholder="Phone" required>
                        <input name="email" type="email" class="form-control mb-3" placeholder="Email">
                        <input name="address" class="form-control mb-3" placeholder="Address">
                        <select name="availableToday" class="form-select mb-3">
                            <option value="true">Available Today</option>
                            <option value="false">Not Available</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Save</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
