<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoices - Hospital Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background:#f8f9fa; }
        .sidebar { width:250px; height:100vh; background:#0d6efd; color:white; position:fixed; top:0; left:0; padding-top:20px; }
        .sidebar h3 { margin-left:20px; font-weight:bold; }
        .sidebar .nav-link { color:white; padding:12px 20px; display:block; font-weight:500; }
        .sidebar .nav-link:hover { background:#084298; border-radius:6px; }
        .content { margin-left:250px; padding:30px; }
        table { width:100%; background:white; border-radius:10px; box-shadow:0px 3px 10px rgba(0,0,0,0.1); }
        th, td { padding:12px; border-bottom:1px solid #ddd; text-align:center; }
        th { background-color:#0d6efd; color:white; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Dashboard</h3>
    <a href="/patient" class="nav-link">Patients</a>
    <a href="/doctor" class="nav-link">Doctors</a>
    <a href="/appointments" class="nav-link">Appointments</a>
    <a href="/staff" class="nav-link">Staff</a>
    <a href="/invoice" class="nav-link">Invoices</a>
    <a href="/logout" class="nav-link">Logout</a>
</div>

<div class="content">
    <h2>Invoices</h2>
    <div class="mb-3">
        <a href="/invoice/download/pdf" class="btn btn-danger btn-sm">Download PDF</a>
        <a href="/invoice/download/csv" class="btn btn-success btn-sm">Download CSV</a>
        <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#invoiceModal">
            Generate New Invoice
        </button>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Treatment</th>
            <th>Amount</th>
            <th>Payment Mode</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="invoice : ${invoices}">
            <td th:text="${invoice.id}">1</td>
            <td th:text="${invoice.patientName}">Patient</td>
            <td th:text="${invoice.doctorName}">Doctor</td>
            <td th:text="${invoice.treatment}">Checkup</td>
            <td th:text="${invoice.amount}">1000</td>
            <td th:text="${invoice.paymentMode}">Cash</td>
            <td th:text="${invoice.status}">Paid</td>
            <td th:text="${#temporals.format(invoice.date, 'yyyy-MM-dd HH:mm')}">2025-10-11</td>
            <td>
                <a th:href="@{'/invoice/download/pdf/' + ${invoice.id}}" class="btn btn-danger btn-sm">PDF</a>
                <a th:href="@{'/invoice/download/csv/' + ${invoice.id}}" class="btn btn-success btn-sm">CSV</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- ===== Invoice Modal Popup ===== -->
<!-- ===== Invoice Modal Popup ===== -->
<div class="modal fade" id="invoiceModal" tabindex="-1" aria-labelledby="invoiceModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/invoice/save}" method="post" th:object="${invoice}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="invoiceModalLabel">Generate New Invoice</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="row g-3">

                        <!-- Existing Patient Checkbox -->
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="existingPatientCheck" checked>
                                <label class="form-check-label" for="existingPatientCheck">
                                    Select Existing Patient
                                </label>
                            </div>
                        </div>

                        <!-- Patient Name (Dropdown or Text Input) -->
                        <div class="col-md-6">
                            <label class="form-label">Patient Name</label>

                            <!-- Dropdown (Existing Patient) -->
                            <select class="form-select" id="patientDropdown" th:field="*{patientName}">
                                <option value="" disabled selected>Select Patient</option>
                                <option th:each="p : ${patients}" th:value="${p.name}" th:text="${p.name}"></option>
                            </select>

                            <!-- Text Field (Manual Entry) -->
                            <input type="text" class="form-control mt-2 d-none" id="patientText" placeholder="Enter patient name manually" th:field="*{patientName}">
                        </div>

                        <!-- Doctor Dropdown -->
                        <div class="col-md-6">
                            <label class="form-label">Doctor Name</label>
                            <select class="form-select" th:field="*{doctorName}" required>
                                <option value="" disabled selected>Select Doctor</option>
                                <option th:each="d : ${doctors}" th:value="${d.name}" th:text="${d.name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Treatment</label>
                            <input type="text" class="form-control" th:field="*{treatment}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Amount</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{amount}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Payment Mode</label>
                            <select class="form-select" th:field="*{paymentMode}">
                                <option value="Cash">Cash</option>
                                <option value="Card">Card</option>
                                <option value="UPI">UPI</option>
                                <option value="Insurance">Insurance</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="Paid">Paid</option>
                                <option value="Pending">Pending</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save Invoice</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ===== Toggle Script ===== -->
<script>
    const checkbox = document.getElementById('existingPatientCheck');
    const dropdown = document.getElementById('patientDropdown');
    const textInput = document.getElementById('patientText');

    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        dropdown.classList.remove('d-none');
        textInput.classList.add('d-none');
      } else {
        dropdown.classList.add('d-none');
        textInput.classList.remove('d-none');
      }
    });
</script>


</body>
</html>
