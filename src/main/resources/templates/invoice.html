<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoices - Hospital Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f8f9fa; }
        .sidebar { width:250px; height:100vh; background:#0d6efd; color:white; position:fixed; top:0; left:0; padding-top:20px; }
        .sidebar h3 { margin-left:20px; font-weight:bold; }
        .sidebar .nav-link { color:white; padding:12px 20px; display:block; font-weight:500; }
        .sidebar .nav-link:hover { background:#084298; border-radius:6px; }
        .content { margin-left:250px; padding:30px; }
        table { width:100%; background:white; border-radius:10px; box-shadow:0px 3px 10px rgba(0,0,0,0.1); }
        th, td { padding:12px; border-bottom:1px solid #ddd; }
        th { background-color:#0d6efd; color:white; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Dashboard</h3>
    <a href="/patient" class="nav-link">Patients</a>
    <a href="/doctor" class="nav-link">Doctors</a>
    <a href="/appointment" class="nav-link">Appointments</a>
    <a href="/staff" class="nav-link">Staff</a>
    <a href="/invoice" class="nav-link">Invoices</a>
    <a href="/logout" class="nav-link">Logout</a>
</div>

<div class="content">
    <h2>Invoices</h2>
    <div class="mb-3">
        <a href="/invoice/download/pdf" class="btn btn-danger btn-sm">Download PDF</a>
        <a href="/invoice/download/csv" class="btn btn-success btn-sm">Download CSV</a>
        <a href="/appointment" class="btn btn-primary btn-sm">Generate New Invoice</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Treatment</th>
            <th>Amount</th>
            <th>Payment Mode</th>
            <th>Status</th>
            <th>Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="invoice : ${invoices}">
            <td th:text="${invoice.id}">1</td>
            <td th:text="${invoice.patientName}">Patient</td>
            <td th:text="${invoice.doctorName}">Doctor</td>
            <td th:text="${invoice.treatment}">Checkup</td>
            <td th:text="${invoice.amount}">1000</td>
            <td th:text="${invoice.paymentMode}">Cash</td>
            <td th:text="${invoice.status}">Paid</td>
            <td th:text="${#temporals.format(invoice.date, 'yyyy-MM-dd HH:mm')}">2025-10-11</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
