<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoices - Hospital Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f8f9fa; margin:0; padding:0; }
        .sidebar { width:250px; height:100vh; background:#0d6efd; color:white; position:fixed; top:0; left:0; padding-top:20px; }
        .sidebar h3 { margin-left:20px; font-weight:bold; }
        .sidebar .nav-link { color:white; padding:12px 20px; display:block; font-weight:500; }
        .sidebar .nav-link:hover { background:#084298; border-radius:6px; }
        .sidebar .logout { position:absolute; bottom:20px; left:20px; color:white; font-weight:bold; text-decoration:none; }
        .sidebar .logout:hover { text-decoration:underline; }
        .content { margin-left:250px; padding:30px; }
        table { width:100%; background:white; border-radius:10px; box-shadow:0px 3px 10px rgba(0,0,0,0.1); }
        th, td { padding:12px; text-align:left; border-bottom:1px solid #ddd; }
        th { background-color:#0d6efd; color:white; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Dashboard</h3>
    <a href="/patient" class="nav-link">Patients</a>
    <a href="/doctor" class="nav-link">Doctors</a>
    <a href="/appointment" class="nav-link">Appointments</a>
    <a href="/staff" class="nav-link">Staff</a>
    <a href="/invoice" class="nav-link">Invoices</a>
    <a href="/logout" class="logout">Logout</a>
</div>

<div class="content">
    <h2>Invoices</h2>

    <div class="mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#invoiceModal">New Invoice</button>
        <a href="/invoice/download/pdf" class="btn btn-danger">Download PDF</a>
        <a href="/invoice/download/csv" class="btn btn-success">Download CSV</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Treatment</th>
            <th>Amount</th>
            <th>Payment Mode</th>
            <th>Status</th>
            <th>Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="invoice : ${invoices}">
            <td th:text="${invoice.id}">1</td>
            <td th:text="${invoice.patientName}">Patient Name</td>
            <td th:text="${invoice.doctorName}">Doctor Name</td>
            <td th:text="${invoice.treatment}">Treatment</td>
            <td th:text="${invoice.amount}">1000</td>
            <td th:text="${invoice.paymentMode}">Cash</td>
            <td th:text="${invoice.status}">Paid</td>
            <td th:text="${#temporals.format(invoice.date, 'yyyy-MM-dd HH:mm')}">2025-09-28</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- 🟢 New Invoice Modal -->
<div class="modal fade" id="invoiceModal" tabindex="-1" aria-labelledby="invoiceModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form th:action="@{/invoice/save}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="invoiceModalLabel">Create Invoice</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label>Patient Name</label>
                    <input type="text" class="form-control" name="patientName" required>
                </div>
                <div class="mb-2">
                    <label>Doctor Name</label>
                    <input type="text" class="form-control" name="doctorName" required>
                </div>
                <div class="mb-2">
                    <label>Treatment</label>
                    <input type="text" class="form-control" name="treatment" required>
                </div>
                <div class="mb-2">
                    <label>Amount</label>
                    <input type="number" step="0.01" class="form-control" name="amount" required>
                </div>
                <div class="mb-2">
                    <label>Payment Mode</label>
                    <select class="form-control" name="paymentMode">
                        <option>Cash</option>
                        <option>Card</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label>Status</label>
                    <select class="form-control" name="status">
                        <option>Paid</option>
                        <option>Pending</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Save Invoice</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
