<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="dashboard :: sidebar"></div>
<div class="container mt-4">
    <h2 th:text="${doctor.id == null ? 'Add Doctor' : 'Edit Doctor'}"></h2>

    <form th:action="@{/doctors/save}" th:object="${doctor}" method="post" class="mt-3">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Specialization</label>
            <input type="text" th:field="*{specialization}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Contact</label>
            <input type="text" th:field="*{contact}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Available Today</label>
            <input type="checkbox" th:field="*{availableToday}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">On Leave</label>
            <input type="checkbox" th:field="*{onLeave}"/>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/doctors}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
