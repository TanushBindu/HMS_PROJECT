<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Add Appointment</h2>

    <form th:action="@{/appointments/add}" method="post">
        <div class="mb-3">
            <label>Patient</label>
            <select name="patientId" class="form-select" required>
                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Doctor</label>
            <select name="doctorId" class="form-select" required>
                <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name + ' (' + d.specialization + ')'}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Reason</label>
            <input type="text" name="reason" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Date & Time</label>
            <input type="datetime-local" name="dateTime" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-select" required>
                <option value="SCHEDULED">Scheduled</option>
                <option value="UPCOMING">Upcoming</option>
                <option value="COMPLETED">Completed</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
</body>
</html>
