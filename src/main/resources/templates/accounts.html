<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Accounts Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container mt-4">
    <h2>Accounts Dashboard - [[${year}]]</h2>

    <div class="row mt-4">
        <div class="col-md-6">
            <h4>Specialist-wise Income</h4>
            <table class="table table-striped">
                <thead>
                <tr><th>Specialization</th><th>Month</th><th>Income</th></tr>
                </thead>
                <tbody>
                <tr th:each="inc : ${specialistIncome}">
                    <td th:text="${inc.type}"></td>
                    <td th:text="${inc.month}"></td>
                    <td th:text="${inc.amount}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="col-md-6">
            <h4>Patient Type Income</h4>
            <table class="table table-striped">
                <thead>
                <tr><th>Patient Type</th><th>Month</th><th>Income</th></tr>
                </thead>
                <tbody>
                <tr th:each="inc : ${patientIncome}">
                    <td th:text="${inc.type}"></td>
                    <td th:text="${inc.month}"></td>
                    <td th:text="${inc.amount}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <h4>Biomedical Waste Income</h4>
            <table class="table table-striped">
                <thead>
                <tr><th>Date</th><th>Description</th><th>Amount</th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bioIncome}">
                    <td th:text="${b.date}"></td>
                    <td th:text="${b.description}"></td>
                    <td th:text="${b.amount}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <h4>Revenue vs Expenditure</h4>
            <canvas id="revenueChart"></canvas>
        </div>
        <div class="col-md-6">
            <h4>ROI</h4>
            <div class="alert alert-success" th:text="${roi}"></div>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('revenueChart').getContext('2d');
    const revenue = [[${totalRevenue}]];
    const expenditure = [[${totalExpenditure}]];

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Revenue', 'Expenditure'],
            datasets: [{
                label: 'Amount',
                data: [revenue, expenditure],
                backgroundColor: ['#4caf50', '#f44336']
            }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
    });
</script>
</body>
</html>
