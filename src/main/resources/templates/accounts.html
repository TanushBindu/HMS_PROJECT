<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
    <h5>HMS Admin</h5>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/patients">Patients</a>
    <a href="/admin/accounts" class="active">Accounts</a>
    <a href="/logout">Logout</a>
</div>

<div class="content">
    <h2>Accounts</h2>
    <p class="text-muted">Invoices, revenue and bills</p>

    <!-- KPI row -->
    <div class="row g-3 mb-3">
        <div class="col-md-3">
            <div class="kpi bg-primary"><h6>Monthly Revenue</h6><p th:text="'₹ ' + ${monthlyRevenue}">₹ 0</p></div>
        </div>
        <div class="col-md-3">
            <div class="kpi" style="background:#6610f2"><h6>Yearly Revenue</h6><p th:text="'₹ ' + ${yearlyRevenue}">₹ 0</p></div>
        </div>
        <div class="col-md-3">
            <div class="kpi" style="background:#fd7e14"><h6>Monthly Bills</h6><p th:text="${monthlyBills}">0</p></div>
        </div>
        <div class="col-md-3">
            <div class="kpi" style="background:#dc3545"><h6>Yearly Bills</h6><p th:text="${yearlyBills}">0</p></div>
        </div>
    </div>

    <!-- Filter -->
    <form th:action="@{/admin/accounts}" method="get" class="row g-2 mb-3 align-items-end">
        <div class="col-md-2">
            <label class="form-label">Month</label>
            <select name="month" class="form-select">
                <option value="">All</option>
                <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}"
                        th:selected="${m == selectedMonth}" th:text="${m}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label">Year</label>
            <select name="year" class="form-select">
                <option value="">All</option>
                <option th:each="y : ${#numbers.sequence(2018,2025)}" th:value="${y}"
                        th:selected="${y == selectedYear}" th:text="${y}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary btn-rounded">Filter</button>
        </div>
    </form>

    <!-- Invoice Form -->
    <div class="card p-3 mb-4">
        <h5>Generate Invoice</h5>
        <form th:action="@{/admin/accounts/invoice}" method="post" class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Patient</label>
                <select name="patientId" class="form-select" required>
                    <option value="">Select patient</option>
                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Amount</label>
                <input name="amount" type="number" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="PAID">PAID</option>
                    <option value="PENDING">PENDING</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-success w-100 btn-rounded">Generate</button>
            </div>
        </form>
    </div>

    <!-- Invoice Table -->
    <div class="card p-3">
        <h5>Invoices</h5>
        <table class="table table-hover mt-2">
            <thead>
            <tr><th>ID</th><th>Patient</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="inv : ${invoices}">
                <td th:text="${inv.id}"></td>
                <td th:text="${inv.patient.name}"></td>
                <td th:text="'₹ ' + ${inv.amount}"></td>
                <td th:text="${inv.date}"></td>
                <td><span th:text="${inv.status}"></span></td>
                <td>
                    <a th:href="@{'/admin/accounts/invoice/pdf/' + ${inv.id}}" class="btn btn-sm btn-outline-primary">PDF</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
