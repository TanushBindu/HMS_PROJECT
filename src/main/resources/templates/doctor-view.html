<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="dashboard :: sidebar"></div>
<div class="container mt-4">
    <h2>Doctor Details</h2>
    <table class="table">
        <tr><th>ID</th><td th:text="${doctor.id}"></td></tr>
        <tr><th>Name</th><td th:text="${doctor.name}"></td></tr>
        <tr><th>Specialization</th><td th:text="${doctor.specialization}"></td></tr>
        <tr><th>Contact</th><td th:text="${doctor.contact}"></td></tr>
        <tr><th>Username</th><td th:text="${doctor.username}"></td></tr>
        <tr><th>Available Today</th><td th:text="${doctor.availableToday}"></td></tr>
        <tr><th>On Leave</th><td th:text="${doctor.onLeave}"></td></tr>
    </table>
    <a th:href="@{/doctors}" class="btn btn-secondary">Back</a>
</div>
</body>
</html>
