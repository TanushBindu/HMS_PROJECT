<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Module Access</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Module Access for <span th:text="${staff.name}">Staff Name</span></h2>

    <form th:action="@{/access-control/{staffId}(staffId=${staff.id})}" method="post">
        <table class="table table-bordered mt-3">
            <thead>
            <tr>
                <th>Module</th>
                <th>Access</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="module : ${modules}">
                <td th:text="${module.name}">Module Name</td>
                <td>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox"
                               th:name="moduleIds"
                               th:value="${module.id}"
                               th:checked="${accessMap[module.id]} ? 'checked' : null">
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <button type="submit" class="btn btn-primary">Save Access</button>
        <a th:href="@{/staff}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
