<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f9fc;
            font-family: 'Segoe UI', sans-serif;
        }
        .sidebar {
            background-color: #0d6efd;
            min-height: 100vh;
            color: #fff;
            padding: 20px 15px;
        }
        .sidebar h4 {
            margin-bottom: 20px;
            font-weight: bold;
        }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #084298;
        }
        .main-content {
            padding: 30px;
        }
        .card-patient {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }
        .card-patient img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
        }
        .patient-info {
            flex-grow: 1;
        }
        .patient-name {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }
        .patient-meta {
            color: #6c757d;
            font-size: 14px;
        }
        .btn-edit {
            background-color: #6c757d;
            color: #fff;
        }
        .btn-delete {
            background-color: #dc3545;
            color: #fff;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .btn-add {
            background-color: #0d6efd;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="row g-0">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
        <h4>Patients</h4>
        <a th:href="@{/patients}" class="active">All Patients</a>
        <a th:href="@{/patients/opd}">OPD Patients</a>
        <a th:href="@{/patients/in}">In-Patients</a>
    </div>

    <!-- Main content -->
    <div class="col-md-10 main-content">
        <div class="top-bar">
            <h2>Patients</h2>
            <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addPatientModal">+ Add Patient</button>
        </div>

        <!-- Patient Cards -->
        <div th:each="p : ${patients}" class="card-patient">
            <img src="https://via.placeholder.com/50" alt="avatar">
            <div class="patient-info">
                <p class="patient-name" th:text="${p.name}"></p>
                <p class="patient-meta">
                    <span th:text="${p.age} + ' yrs'"></span> •
                    <span th:text="${p.gender}"></span> •
                    <span th:text="${p.type}"></span>
                </p>
            </div>
            <div>
                <button class="btn btn-sm btn-edit me-2" th:onclick="'openEditPatient(' + ${p.id} + ')'">Edit</button>
                <a th:href="@{'/patients/delete/' + ${p.id}}" class="btn btn-sm btn-delete"
                   onclick="return confirm('Are you sure you want to delete this patient?')">Delete</a>
            </div>
        </div>
    </div>
</div>

<!-- Add Patient Modal -->
<div class="modal fade" id="addPatientModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/patients/save}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Add Patient</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label>Name</label><input type="text" name="name" class="form-control" required></div>
                    <div class="mb-3"><label>Age</label><input type="number" name="age" class="form-control" required></div>
                    <div class="mb-3"><label>Gender</label>
                        <select name="gender" class="form-control">
                            <option>Male</option><option>Female</option>
                        </select>
                    </div>
                    <div class="mb-3"><label>Contact</label><input type="text" name="contactNumber" class="form-control"></div>
                    <div class="mb-3"><label>Address</label><input type="text" name="address" class="form-control"></div>
                    <div class="mb-3"><label>Type</label>
                        <select name="type" class="form-control">
                            <option value="OPD">OPD</option>
                            <option value="In-Patient">In-Patient</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal (same as Add but pre-filled) -->
<div class="modal fade" id="editPatientModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/patients/save}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Patient</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="edit-id">
                    <div class="mb-3"><label>Name</label><input type="text" name="name" id="edit-name" class="form-control"></div>
                    <div class="mb-3"><label>Age</label><input type="number" name="age" id="edit-age" class="form-control"></div>
                    <div class="mb-3"><label>Gender</label>
                        <select name="gender" id="edit-gender" class="form-control">
                            <option>Male</option><option>Female</option>
                        </select>
                    </div>
                    <div class="mb-3"><label>Contact</label><input type="text" name="contactNumber" id="edit-contact" class="form-control"></div>
                    <div class="mb-3"><label>Address</label><input type="text" name="address" id="edit-address" class="form-control"></div>
                    <div class="mb-3"><label>Type</label>
                        <select name="type" id="edit-type" class="form-control">
                            <option value="OPD">OPD</option>
                            <option value="In-Patient">In-Patient</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function openEditPatient(id) {
        fetch('/patients/get/' + id)
            .then(resp => resp.json())
            .then(p => {
                document.getElementById('edit-id').value = p.id;
                document.getElementById('edit-name').value = p.name;
                document.getElementById('edit-age').value = p.age;
                document.getElementById('edit-gender').value = p.gender;
                document.getElementById('edit-contact').value = p.contactNumber;
                document.getElementById('edit-address').value = p.address;
                document.getElementById('edit-type').value = p.type;

                new bootstrap.Modal(document.getElementById('editPatientModal')).show();
            });
    }
</script>
</body>
</html>
