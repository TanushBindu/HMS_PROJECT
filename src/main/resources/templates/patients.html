<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div id="content" class="container-fluid">
    <h2 class="mb-4">Patients</h2>

    <!-- Quick Stats -->
    <div class="row mb-4" th:if="${role == 'ADMIN' or role == 'DOCTOR'}">
        <div class="col-md-3">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Total Patients</h5>
                    <p class="card-text" th:text="${totalPatients}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">OPD Patients</h5>
                    <p class="card-text" th:text="${totalOpdPatients}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning">
                <div class="card-body">
                    <h5 class="card-title">In-Patients</h5>
                    <p class="card-text" th:text="${totalInPatients}">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Patients Table -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
            <span>All Patients</span>
            <div>
                <input type="text" id="searchPatients" class="form-control form-control-sm d-inline-block"
                       placeholder="Search by name..." style="width:200px;">
                <a th:href="@{/patients/add}" class="btn btn-sm btn-primary ms-2" th:if="${role == 'ADMIN'}">
                    <i class="bi bi-plus-circle"></i> Add Patient
                </a>
            </div>
        </div>
        <div class="card-body table-responsive">
            <table id="patientsTable" class="table table-hover table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Contact</th>
                    <th th:if="${role == 'ADMIN' or role == 'DOCTOR'}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="patient : ${patients}">
                    <td th:text="${patient.id}">1</td>
                    <td th:text="${patient.name}">John Doe</td>
                    <td th:text="${patient.type}">OPD</td>
                    <td th:text="${patient.contact}">1234567890</td>
                    <td th:if="${role == 'ADMIN' or role == 'DOCTOR'}">
                        <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/patients/view/{id}(id=${patient.id})}" class="btn btn-sm btn-info">View</a>
                        <a th:href="@{/patients/delete/{id}(id=${patient.id})}"
                           onclick="return confirm('Delete patient?');"
                           class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchPatients');
        const patientsTable = document.getElementById('patientsTable').getElementsByTagName('tbody')[0];
        searchInput.addEventListener('keyup', function () {
            const filter = searchInput.value.toLowerCase();
            Array.from(patientsTable.rows).forEach(row => {
                const nameCell = row.cells[1].textContent.toLowerCase();
                row.style.display = nameCell.includes(filter) ? '' : 'none';
            });
        });
    </script>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
