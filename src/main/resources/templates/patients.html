<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f7f9fc; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #0d6efd; min-height: 100vh; color:#fff; padding:20px 15px; }
        .sidebar h4 { margin-bottom:20px; font-weight:bold; }
        .sidebar .nav-link { color:#fff; padding:10px; border-radius:6px; margin-bottom:8px; display:flex; justify-content:space-between; }
        .sidebar .nav-link.active, .sidebar .nav-link:hover { background-color: #084298; text-decoration:none; }
        .main-content { padding:30px; }
        .card-patient { display:flex; align-items:center; background:#fff; padding:18px; border-radius:12px; margin-bottom:12px; box-shadow:0 2px 5px rgba(0,0,0,0.06); }
        .patient-name { font-size:18px; font-weight:600; margin:0; }
        .patient-meta { color:#6c757d; font-size:14px; }
        .btn-edit { background:#ffc107; color:#000; }
        .btn-delete { background:#dc3545; color:#fff; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .count-badge { font-size:20px; font-weight:700; }
        .filter-search { max-width:360px; }
    </style>
</head>
<body>
<div class="row g-0">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
        <h4>Patients</h4>

        <a href="#" class="nav-link active" data-filter="ALL" id="filter-all">
            <span>All Patients</span>
            <span class="badge bg-light text-dark" th:text="${patients.size()}">0</span>
        </a>

        <a href="#" class="nav-link" data-filter="OPD" id="filter-opd">
            <span>OPD Patients</span>
            <span class="badge bg-light text-dark" th:text="${opdCount}">0</span>
        </a>

        <a href="#" class="nav-link" data-filter="IN" id="filter-in">
            <span>In-Patients</span>
            <span class="badge bg-light text-dark" th:text="${inCount}">0</span>
        </a>
    </div>

    <!-- Main content -->
    <div class="col-md-10 main-content">
        <div class="top-bar">
            <div>
                <h2>Patients</h2>
                <p class="text-muted">Manage and search patient records</p>
            </div>

            <div class="d-flex align-items-center gap-2">
                <input id="searchBox" type="search" class="form-control form-control-sm filter-search" placeholder="Search by name/phone/type">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPatientModal">+ Add Patient</button>
            </div>
        </div>

        <!-- Patient list container -->
        <div id="patientsContainer">
            <div th:each="p : ${patients}" class="card-patient" th:attr="data-type=${p.type}">
                <div class="flex-grow-1 me-3">
                    <p class="patient-name" th:text="${p.name}">Patient Name</p>
                    <p class="patient-meta">
                        <span th:text="${p.age != null ? p.age + ' yrs' : ''}">30 yrs</span> •
                        <span th:text="${p.gender}">Male</span> •
                        <span th:text="${p.type}">OPD</span>
                    </p>
                    <p class="patient-meta"><small th:text="${p.phone}">+91-xxxx</small></p>
                    <p class="patient-meta"><small th:text="${p.address}">Address</small></p>
                </div>

                <div class="text-end">
                    <button type="button" class="btn btn-sm btn-edit mb-1" th:onclick="'openEditPatient(' + ${p.id} + ')'">Edit</button>
                    <a th:href="@{'/patients/delete/' + ${p.id}}" class="btn btn-sm btn-delete" onclick="return confirm('Delete this patient?')">Delete</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Patient Modal -->
<div class="modal fade" id="addPatientModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/patients/save}" th:object="${patient}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Add Patient</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label>Name</label><input type="text" th:field="*{name}" class="form-control" required/></div>
                    <div class="mb-3"><label>Age</label><input type="number" th:field="*{age}" class="form-control"/></div>
                    <div class="mb-3"><label>Gender</label>
                        <select th:field="*{gender}" class="form-control">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="mb-3"><label>Contact</label><input type="text" th:field="*{phone}" class="form-control"/></div>
                    <div class="mb-3"><label>Address</label><input type="text" th:field="*{address}" class="form-control"/></div>
                    <div class="mb-3"><label>Type</label>
                        <select th:field="*{type}" class="form-control">
                            <option value="">Select Type</option>
                            <option value="OPD">OPD</option>
                            <option value="In-Patient">In-Patient</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Patient Modal -->
<div class="modal fade" id="editPatientModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editForm" th:action="@{/patients/update/__id__}" method="post">
                <input type="hidden" name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="id" id="edit-id"/>
                <div class="modal-header"><h5>Edit Patient</h5></div>
                <div class="modal-body">
                    <div class="mb-3"><label>Name</label><input type="text" name="name" id="edit-name" class="form-control"/></div>
                    <div class="mb-3"><label>Age</label><input type="number" name="age" id="edit-age" class="form-control"/></div>
                    <div class="mb-3"><label>Gender</label>
                        <select name="gender" id="edit-gender" class="form-control">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="mb-3"><label>Contact</label><input type="text" name="phone" id="edit-phone" class="form-control"/></div>
                    <div class="mb-3"><label>Address</label><input type="text" name="address" id="edit-address" class="form-control"/></div>
                    <div class="mb-3"><label>Type</label>
                        <select name="type" id="edit-type" class="form-control">
                            <option value="">Select Type</option>
                            <option value="OPD">OPD</option>
                            <option value="In-Patient">In-Patient</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    function openEditPatient(id){
        fetch('/patients/get/' + id)
            .then(r => r.json())
            .then(p => {
                document.getElementById('edit-id').value = p.id;
                document.getElementById('edit-name').value = p.name;
                document.getElementById('edit-age').value = p.age;
                document.getElementById('edit-gender').value = p.gender;
                document.getElementById('edit-phone').value = p.phone;
                document.getElementById('edit-address').value = p.address;
                document.getElementById('edit-type').value = p.type;
                document.getElementById('editForm').action = '/patients/update/' + id;
                new bootstrap.Modal(document.getElementById('editPatientModal')).show();
            });
    }

    // Filtering & search
    const sidebarLinks = document.querySelectorAll('.sidebar .nav-link');
    const patientsContainer = document.getElementById('patientsContainer');
    const searchBox = document.getElementById('searchBox');

    function applyFilter(filter){
        sidebarLinks.forEach(link => link.classList.remove('active'));
        document.querySelector(`[data-filter="${filter}"]`).classList.add('active');

        const q = searchBox.value.toLowerCase();
        Array.from(patientsContainer.children).forEach(card => {
            const type = (card.getAttribute('data-type') || '').toLowerCase();
            const name = card.querySelector('.patient-name').textContent.toLowerCase();
            const phone = card.querySelector('.patient-meta small').textContent.toLowerCase();

            let typeMatch = filter === 'ALL' || type.includes(filter.toLowerCase());
            let searchMatch = q === '' || name.includes(q) || phone.includes(q) || type.includes(q);

            card.style.display = (typeMatch && searchMatch) ? 'flex' : 'none';
        });
    }

    sidebarLinks.forEach(link => link.addEventListener('click', e => {
        e.preventDefault();
        applyFilter(link.dataset.filter);
    }));

    searchBox.addEventListener('input', () => {
        const active = document.querySelector('.sidebar .nav-link.active').dataset.filter;
        applyFilter(active);
    });

    applyFilter('ALL');
    /*]]>*/
</script>
</body>
</html>
